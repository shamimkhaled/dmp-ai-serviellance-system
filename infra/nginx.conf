# Reverse proxy — browser-facing HTTP/WebSocket front door.
# Production: terminate TLS in front of this server (or add listen 443 ssl here).
# Live video: WHEP signaling and ICE stay on MediaMTX :8889 / :8189 (not proxied).

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 8m;

    # ── React dashboard (Vite HMR needs Upgrade) ──
    location / {
        proxy_pass         http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Video ingest: /ingest/* → video-ingest /* ──
    location /ingest/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass         http://video-ingest:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
        proxy_read_timeout 60s;
    }

    # Plan alias: /api/cameras → /cameras (also used if clients call /api/cameras)
    location /api/cameras {
        limit_req zone=api burst=40 nodelay;
        proxy_pass         http://video-ingest:8001/cameras;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
        proxy_read_timeout 60s;
    }

    # ── Drafting (prefix longer than /api/) ──
    location /api/draft {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://drafting:8006/draft;
        proxy_read_timeout 120s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
    }

    # ── Alert service REST + WebSocket under /api/ws ──
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass         http://alert-service:8004/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
        proxy_read_timeout 86400;
    }

    # ── Alert WebSocket ──
    location /ws/ {
        proxy_pass         http://alert-service:8004/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
        proxy_read_timeout 86400;
    }

    # ── Traffic AI (health, detections WS, MJPEG preview) ──
    location /ai/ {
        proxy_pass         http://traffic-ai:8002/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_set_header   X-Access-Token $arg_access_token;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

    # ── HLS fallback (optional; dashboard still uses :8888 for MediaMTX) ──
    location /hls/ {
        proxy_pass         http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
